services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env.deploy
    volumes:
      - review-data:/data
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 4g
    cpus: 2
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_HOST: ${APP_HOST:?set domain in deployment environment}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  review-data:
  caddy-data:
  caddy-config:
